<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"></meta>
    </head>
    <body>
        <p>無序列表</p>
        <ul>
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ul>

        <p>有序列表</p>
        <ol>
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ol>

        <p>大寫字母列表</p>
        <ol type="A">
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ol>

        <p>小寫字母列表</p>
        <ol type="a">
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ol>

        <p>小寫羅馬數字列表</p>
        <ol type="i">
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ol>

        <p>大寫羅馬數字列表</p>
        <ol type="I">
            <li>動畫瘋</li>
            <li>YouTube</li>
        </ol>

        <table width="200">
            <tr>
                <td>date</td>
                <td>體溫</td>
                <td>體重</td>
            </tr>
            <tr>
                <td>2/10</td>
                <td>36.5</td>
                <td>80.2</td>
            </tr>
            <tr>
                <td>2/11</td>
                <td>36.6</td>
                <td>80.1</td>
            </tr>
        </table>
    </body>
</html>
